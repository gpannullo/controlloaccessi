{% extends "base.html" %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body p-4"><h1 class="h4">Completa il tuo profilo</h1><p class="text-muted">Per utilizzare la piattaforma inserisci i recapiti personali necessari per il recupero della password.</p>{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<label class="form-label">E-mail personale</label><input class="form-control mb-3" type="email" name="email_personale" required><label class="form-label">Cellulare personale</label><input class="form-control mb-3" type="tel" name="cellulare_personale" required><button class="btn btn-danger w-100">Completa profilo</button></form></div></div></div></div></div>{% endblock %}
