{% extends "base.html" %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body p-4"><h1 class="h4">Cambia password</h1>{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<label class="form-label">Password attuale</label><input class="form-control mb-3" type="password" name="current_password" autocomplete="current-password" required><label class="form-label">Nuova password</label><input class="form-control mb-3" type="password" name="password" autocomplete="new-password" minlength="12" required><label class="form-label">Conferma nuova password</label><input class="form-control mb-3" type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required><button class="btn btn-danger">Aggiorna password</button><a class="btn btn-outline-secondary" href="{% url 'my_account' %}">Annulla</a></form></div></div></div></div></div>{% endblock %}
