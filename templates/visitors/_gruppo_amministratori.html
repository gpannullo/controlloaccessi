<section class="mb-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="group-title">{{ titolo }}</div>
        <span class="badge bg-secondary">{{ persone|length }}</span>
    </div>

    <div class="admin-grid">
        {% for persona in persone %}
            <div class="admin-card">
                <div class="admin-name">
                    {% firstof persona.utente.get_full_name persona.utente.username "—" %}
                </div>

                <div class="admin-actions">
                    <form
                        method="post"
                        action="{% url 'portineria:registra_transito_amministratore' persona.pk %}"
                    >
                        {% csrf_token %}
                        <input type="hidden" name="tipo" value="IN">
                        <button type="submit" class="btn btn-success btn-sm w-100 py-1 px-1 small">
                            Ingresso
                        </button>
                    </form>

                    <form
                        method="post"
                        action="{% url 'portineria:registra_transito_amministratore' persona.pk %}"
                    >
                        {% csrf_token %}
                        <input type="hidden" name="tipo" value="OUT">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100 py-1 px-1 small">
                            Uscita
                        </button>
                    </form>
                </div>
            </div>
        {% empty %}
            <div class="text-muted small">
                Nessun utente attivo nel gruppo {{ titolo }}.
            </div>
        {% endfor %}
    </div>
</section>
