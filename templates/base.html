<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Controllo Accessi
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="https://cdn.datatables.net/2.3.0/css/dataTables.bootstrap5.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>button[data-bs-target^="#nota-portineria"] { font-size: 1.25rem; line-height: 1; }</style>
</head>

<body class="bg-light">

    {% block content %}
    {% endblock %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="https://cdn.datatables.net/2.3.0/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.0/js/dataTables.bootstrap5.js"></script>
    <script>document.querySelectorAll('[title="Nota della portineria"]').forEach(e=>{e.title='Note aggiuntive';e.innerHTML='<i class="bi bi-sticky"></i>'});document.querySelectorAll('[title="Nessuna nota della portineria"]').forEach(e=>{e.title='Nessuna nota aggiuntiva';e.innerHTML='<i class="bi bi-sticky"></i>'});document.querySelectorAll('.modal[id^="nota-portineria"] .modal-title').forEach(e=>e.textContent='Note aggiuntive');</script>
    <script>if (location.pathname.endsWith('/personale/')) new DataTable('table.table',{pageLength:10,lengthMenu:[[10,20,50,100,-1],[10,20,50,100,'Tutti']],language:{url:'https://cdn.datatables.net/plug-ins/2.3.0/i18n/it-IT.json'}});</script>

</body>

</html>
